<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parcel Extract</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="32" height="32" alt="">
    <div>
      <strong>Parcel Extract</strong>
      <p>Owners, town, and mailing address. <span id="version"></span></p>
    </div>
  </header>

  <section id="known">
    <h2>Ketchikan</h2>
    <button id="owners" class="choice" type="button">
      <strong>Owners and mailing</strong>
      <span>Parcel number, owner, town, and mailing address</span>
    </button>
  </section>

  <section id="detected" hidden>
    <h2>On this page</h2>
    <div id="detected-list"></div>
  </section>

  <form id="manual">
    <label for="url">Paste a MapServer or FeatureServer URL</label>
    <input id="url" name="url" type="url" placeholder="https://host/…/MapServer/0" autocomplete="off" spellcheck="false">
    <button type="submit">Choose fields</button>
  </form>

  <section id="recent" hidden>
    <h2>Recent</h2>
    <div id="recent-list"></div>
  </section>

  <p id="status" class="hint" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
